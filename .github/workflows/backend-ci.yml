name: Backend CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./src/backend/ToDos.Backend.slnx

      - name: Build
        run: dotnet build ./src/backend/ToDos.Backend.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ./src/backend/ToDos.Backend.slnx --no-build --configuration Release
